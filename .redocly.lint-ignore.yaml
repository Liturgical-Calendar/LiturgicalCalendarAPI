# This file instructs Redocly's linter to ignore the rules contained for specific parts of your API.
# See https://redocly.com/docs/cli/ for more information.
#
# The four `no-invalid-media-type-examples` entries below (#787, task 6) are a Redocly engine
# false positive, not a spec defect. They fire on the /tests/{rite} GET example's Ambrosian test
# item (litcal_tests/0), which is the first place anywhere in openapi.json to set
# `applies_to.rite: "ambrosian"` inside a schema reached via `LitCalTest.json`'s `AppliesToScope`
# definition. That definition's `allOf`/`if`/`then` Ambrosian restriction, combined with its
# sibling `additionalProperties: false`, appears to confuse Redocly's example validator into
# reporting `applies_to` as having "unevaluated" properties and failing every branch of the
# enclosing `oneOf`. The same example object was independently validated directly against
# `LitCalTest.json` with Python's `jsonschema.Draft7Validator` (with local $ref resolution) and
# produced 0 errors — it is schema-valid. Do not delete this suppression to "fix" the warning
# without re-confirming the example is actually broken; do not widen it to ignore the rule
# elsewhere, since `no-invalid-media-type-examples` catches real example drift (that's the whole
# reason this task exists).
jsondata/schemas/openapi.json:
  no-invalid-media-type-examples:
    - >-
      #/paths/~1tests~1{rite}/get/responses/200/content/application~1json/example/litcal_tests/0/applies_to/rite
    - >-
      #/paths/~1tests~1{rite}/get/responses/200/content/application~1json/example/litcal_tests/0/applies_to
    - >-
      #/paths/~1tests~1{rite}/get/responses/200/content/application~1json/example/litcal_tests/0
    - >-
      #/paths/~1tests~1{rite}/get/responses/200/content/application~1json/example/litcal_tests/0/test_type
