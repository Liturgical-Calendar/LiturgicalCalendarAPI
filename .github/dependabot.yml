# Specify a non-default branch for pull requests for composer dependencies

version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    # Raise pull requests for version updates
    # to composer packages against the `development` branch
    target-branch: "development"
    # Labels on pull requests for version updates
    labels:
      - "dependencies"
      - "composer dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "development"
    labels:
      - "dependencies"
      - "github-actions"
    # One pull request for all minor and patch bumps. Separate pull requests that edit the same
    # workflow file cannot all be auto-merged: once the first merges, merging the next means
    # writing a combined workflow file, which the GITHUB_TOKEN used by auto-merge may not do.
    # Major bumps still get a pull request each, for review.
    groups:
      github-actions:
        update-types:
          - "minor"
          - "patch"
