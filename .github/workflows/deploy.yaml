name: Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Deployment target'
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging
      tag:
        description: 'Release tag (production only, e.g. v5.0 or v5.1.2). Ignored for staging.'
        required: false
        type: string
  push:
    branches:
      - development
  release:
    types: [published]

concurrency:
  # Pin per-target so staging and production deploys never serialize behind
  # each other; same-target deploys queue rather than cancel mid-flight.
  group: deploy-${{ (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.target == 'production')) && 'production' || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.target == 'production')) && 'production' || 'staging' }}
    if: github.event_name != 'release' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.target == 'production')) && 'production' || 'staging' }}
    permissions:
      contents: read

    steps:
      - name: Resolve ref and deploy path
        id: params
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GIT_REF: ${{ github.ref }}
          APP_DIR: ${{ vars.VPS_APP_DIR }}
        run: |
          set -euo pipefail
          if [ -z "${APP_DIR}" ]; then
            echo "::error::Repository variable VPS_APP_DIR is not set." >&2
            exit 1
          fi
          case "${EVENT_NAME}" in
            release)
              TARGET="production"
              TAG="${RELEASE_TAG}"
              ;;
            workflow_dispatch)
              TARGET="${INPUT_TARGET}"
              TAG="${INPUT_TAG}"
              ;;
            push)
              # Per the `push: branches: [development]` filter above, this
              # only fires for pushes to development → auto-staging.
              TARGET="staging"
              TAG=""
              ;;
            *)
              echo "::error::Unsupported event: ${EVENT_NAME}" >&2
              exit 1
              ;;
          esac
          if [ "${TARGET}" = "production" ]; then
            if [ -z "${TAG}" ]; then
              echo "::error::tag is required for production deploys (e.g. v5.0)." >&2
              exit 1
            fi
            if ! printf '%s' "${TAG}" | grep -qE '^v[0-9]+\.[0-9]+(\.[0-9]+)?(-[A-Za-z0-9.-]+)?$'; then
              echo "::error::tag must match v<MAJOR>.<MINOR>(.<PATCH>)?(-prerelease)? - got: ${TAG}" >&2
              exit 1
            fi
            MAJOR=$(printf '%s' "${TAG}" | sed -E 's/^v([0-9]+)\..*/\1/')
            REF="${TAG}"
            SUBDIR="v${MAJOR}"
          else
            # staging: any branch can be deployed.
            # - push (always from development): REF=development
            # - workflow_dispatch: REF=whatever branch the user picked in
            #   the "Use workflow from" dropdown. This lets feature
            #   branches be sent to staging for end-to-end testing
            #   without merging first.
            if [ "${EVENT_NAME}" = "push" ]; then
              REF="development"
            else
              REF="${GIT_REF#refs/heads/}"
            fi
            SUBDIR="dev"
          fi
          DEPLOY_PATH="${APP_DIR%/}/${SUBDIR}"
          {
            echo "ref=${REF}"
            echo "deploy_subdir=${SUBDIR}"
            echo "deploy_path=${DEPLOY_PATH}"
          } >> "${GITHUB_OUTPUT}"
          echo "::notice::Deploying ${TARGET}: ref=${REF} -> ${DEPLOY_PATH}"

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ steps.params.outputs.ref }}
          persist-credentials: false

      - name: Verify modern codebase shape
        id: shape
        run: |
          set -euo pipefail
          if [ ! -f composer.json ]; then
            echo "::notice::Tag does not contain composer.json; treating as legacy snapshot and skipping the rest of the deploy."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Set up PHP
        if: steps.shape.outputs.skip != 'true'
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2
        with:
          php-version: '8.4'
          extensions: intl, pdo_pgsql, json, simplexml, dom, calendar, zip, yaml, gettext, curl, xml
          tools: composer:v2
          coverage: none

      - name: Install production dependencies
        if: steps.shape.outputs.skip != 'true'
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress --no-scripts --no-plugins --prefer-dist

      - name: Configure SSH
        if: steps.shape.outputs.skip != 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_KNOWN_HOSTS}" ]; then
            echo "::error::Secret VPS_SSH_KNOWN_HOSTS is empty. Refusing to deploy without a pinned host key." >&2
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Sanity-check pinned host key against DNS SSHFP records
        if: steps.shape.outputs.skip != 'true'
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          SSHFP_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          if ! command -v dig >/dev/null; then
            echo "::warning::dig not available; skipping SSHFP drift check."
            exit 0
          fi
          PIN_FPS=$(printf '%s\n' "${SSH_KNOWN_HOSTS}" \
            | awk '$2 ~ /^(ssh-|ecdsa-)/' \
            | while read -r _host _alg keyb64 _; do
                printf '%s' "$keyb64" | base64 -d 2>/dev/null | sha256sum | awk '{print toupper($1)}'
              done \
            | sort -u)
          DNS_FPS=$(dig +short SSHFP "${SSHFP_HOST}" \
            | awk '$2 == "2" {for (i=3; i<=NF; i++) printf "%s", $i; print ""}' \
            | tr -d ' ' \
            | tr 'a-f' 'A-F' \
            | sort -u)
          if [ -z "${DNS_FPS}" ]; then
            echo "::warning::No SHA-256 SSHFP records found for ${SSHFP_HOST}; skipping drift check."
            exit 0
          fi
          if [ -z "${PIN_FPS}" ]; then
            echo "::warning::Could not derive any fingerprints from VPS_SSH_KNOWN_HOSTS; skipping drift check."
            exit 0
          fi
          PIN_NOT_IN_DNS=$(comm -23 <(echo "${PIN_FPS}") <(echo "${DNS_FPS}"))
          DNS_NOT_IN_PIN=$(comm -13 <(echo "${PIN_FPS}") <(echo "${DNS_FPS}"))
          if [ -n "${PIN_NOT_IN_DNS}" ]; then
            while IFS= read -r fp; do
              echo "::warning::Pinned key SHA256:${fp} not in DNS SSHFP for ${SSHFP_HOST}."
            done <<< "${PIN_NOT_IN_DNS}"
          fi
          if [ -n "${DNS_NOT_IN_PIN}" ]; then
            while IFS= read -r fp; do
              echo "::warning::DNS SSHFP advertises SHA256:${fp} not present in VPS_SSH_KNOWN_HOSTS."
            done <<< "${DNS_NOT_IN_PIN}"
          fi
          if [ -z "${PIN_NOT_IN_DNS}" ] && [ -z "${DNS_NOT_IN_PIN}" ]; then
            echo "Pin matches DNS SSHFP records."
          fi

      - name: Ensure deploy + cache + logs dirs exist
        if: steps.shape.outputs.skip != 'true'
        env:
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ steps.params.outputs.deploy_path }}
        run: |
          set -euo pipefail
          remote_cmd=$(printf 'mkdir -p %q %q %q %q' \
            "${DEPLOY_PATH}" \
            "${DEPLOY_PATH}/cache" \
            "${DEPLOY_PATH}/public/engineCache" \
            "${DEPLOY_PATH}/logs")
          # Retry on transient SSH failures (connection reset, fail2ban
          # backoff, MaxStartups contention). 3 attempts with 10s/20s
          # backoff — total worst-case wait 30s before giving up.
          attempt=1
          max=3
          while true; do
            if ssh -i ~/.ssh/deploy_key -p "${VPS_PORT}" \
                -o IdentitiesOnly=yes \
                -o StrictHostKeyChecking=yes \
                -o UserKnownHostsFile=~/.ssh/known_hosts \
                -o ConnectTimeout=10 \
                -o ServerAliveInterval=15 \
                -o ServerAliveCountMax=2 \
                "${VPS_USER}@${VPS_HOST}" \
                "${remote_cmd}"; then
              break
            fi
            if [ "$attempt" -ge "$max" ]; then
              echo "::error::ssh mkdir failed after ${max} attempts" >&2
              exit 1
            fi
            delay=$((attempt * 10))
            echo "::warning::ssh mkdir attempt ${attempt} failed; retrying in ${delay}s..." >&2
            sleep "$delay"
            attempt=$((attempt + 1))
          done

      - name: Deploy via rsync
        if: steps.shape.outputs.skip != 'true'
        env:
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ steps.params.outputs.deploy_path }}
        run: |
          set -euo pipefail
          # Retry on transient SSH-layer failures the underlying rsync
          # surfaces as "Connection reset by peer" / exit code 255. Same
          # 3-attempt 10s/20s backoff as the mkdir step above. rsync's own
          # --partial would help for mid-transfer drops, but the failures
          # we've seen happen at SSH key exchange — before rsync has any
          # bytes on the wire — so a wrapper retry is the right level.
          attempt=1
          max=3
          while true; do
            if rsync \
                --archive --no-owner --no-group \
                --compress --human-readable --verbose \
                --delete --protect-args \
                --exclude-from=.github/deploy/rsync-exclude.txt \
                -e "ssh -i ~/.ssh/deploy_key -p ${VPS_PORT} -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=2" \
                ./ "${VPS_USER}@${VPS_HOST}:${DEPLOY_PATH%/}/"; then
              break
            fi
            if [ "$attempt" -ge "$max" ]; then
              echo "::error::rsync failed after ${max} attempts" >&2
              exit 1
            fi
            delay=$((attempt * 10))
            echo "::warning::rsync attempt ${attempt} failed; retrying in ${delay}s..." >&2
            sleep "$delay"
            attempt=$((attempt + 1))
          done

      - name: Reset OPcache
        if: steps.shape.outputs.skip != 'true'
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          BASE: ${{ vars.VPS_APP_BASE_URL }}
          SUBDIR: ${{ steps.params.outputs.deploy_subdir }}
        # Without this, php-fpm can keep serving cached bytecode of the
        # pre-deploy code (especially when rsync preserves source mtimes
        # that pre-date the cached entries, leaving OPcache's revalidate
        # check unconvinced anything has changed). opcache_reset() is
        # process-shared on FPM SAPI, so one call clears all workers.
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_TOKEN}" ]; then
            echo "::error::DEPLOY_TOKEN secret is empty." >&2
            exit 1
          fi
          if [ -z "${BASE}" ]; then
            echo "::error::Repository variable VPS_APP_BASE_URL is not set." >&2
            exit 1
          fi
          curl -fsS --retry 3 --retry-delay 3 --max-time 30 \
            -X POST \
            -H "X-Deploy-Token: ${DEPLOY_TOKEN}" \
            -H "Accept: text/plain" \
            "${BASE%/}/${SUBDIR}/_ops/opcache-reset"

      - name: Run database migrations
        if: steps.shape.outputs.skip != 'true'
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          BASE: ${{ vars.VPS_APP_BASE_URL }}
          SUBDIR: ${{ steps.params.outputs.deploy_subdir }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_TOKEN}" ]; then
            echo "::error::DEPLOY_TOKEN secret is empty." >&2
            exit 1
          fi
          if [ -z "${BASE}" ]; then
            echo "::error::Repository variable VPS_APP_BASE_URL is not set." >&2
            exit 1
          fi
          # Retry transient TCP failures on the migrate request. Default
          # `--retry` covers timeouts and 5xx but does NOT cover
          # connection-refused — that's gated by `--retry-connrefused`,
          # which we explicitly enable here so a PHP-FPM restart blip
          # between OPcache reset and this call doesn't fail the deploy.
          # (Connection-reset mid-stream is still not retried by default;
          # we'd need `--retry-all-errors` for that, which is more
          # aggressive than warranted at this point — add later if we
          # observe RST-class failures in practice.)
          # Safe to retry: the migrate endpoint is idempotent — Doctrine
          # wraps each migration in a transaction (transactional: true)
          # and uses sync-metadata-storage to claim each version
          # atomically, so a dropped connection mid-run rolls back
          # cleanly and the next attempt re-applies whatever didn't
          # commit.
          curl -fsS --max-time 600 --retry 2 --retry-delay 5 --retry-connrefused \
            -X POST \
            -H "X-Deploy-Token: ${DEPLOY_TOKEN}" \
            -H "Accept: text/plain" \
            "${BASE%/}/${SUBDIR}/_ops/migrate"

      - name: Post-deploy health check
        if: steps.shape.outputs.skip != 'true'
        env:
          BASE: ${{ vars.VPS_APP_BASE_URL }}
          SUBDIR: ${{ steps.params.outputs.deploy_subdir }}
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 5 --max-time 10 \
            "${BASE%/}/${SUBDIR}/calendars" -o /dev/null

      - name: Clean up SSH key
        if: always() && steps.shape.outputs.skip != 'true'
        run: rm -f ~/.ssh/deploy_key
