name: PHPUnit

on:
  push:
    branches: [ development ]
    paths: [
      '**/*.php',
      'composer.json',
      'composer.lock',
      'phpunit*.xml*',
      '.env.example',
      'jsondata/**',
      'i18n/**',
      'infrastructure/init-db.sql'
    ]
  pull_request:
    branches: [ development, stable ]
  workflow_dispatch:

concurrency:
  # The ID of the concurrency group. This must be unique to this workflow.
  group: ${{ github.workflow }}-${{ github.ref }}
  # If true, cancel any previous runs in the same concurrency group.
  cancel-in-progress: true

env:
  PHP_VERSION: '8.4'

jobs:
  phpunit_tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          PGUSER: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Initialize PostgreSQL database
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f infrastructure/init-db.sql
        env:
          PGPASSWORD: postgres

      - name: Setup PHP with PECL extensions
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2.37.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: yaml, intl, zip, calendar, gettext, apcu, opcache, pdo_pgsql
          ini-values: apcu.enable_cli=1, opcache.enable=1, opcache.enable_cli=1

      - name: Cache Composer dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-

      - name: Cache PHPUnit cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .phpunit.cache
          key: phpunit-${{ hashFiles('phpunit.xml.dist') }}
          restore-keys: phpunit-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --classmap-authoritative --no-progress

      - name: Configure environment for testing
        run: |
          cp .env.example .env.local
          echo "UNAUTHENTICATED_RATE_LIMIT=999999" >> .env.local
          echo "DB_HOST=localhost" >> .env.local
          echo "DB_PORT=5432" >> .env.local
          echo "DB_NAME=litcal" >> .env.local
          echo "DB_USER=litcal" >> .env.local
          echo "DB_PASSWORD=litcal_secure_password" >> .env.local

      - name: Install gettext + locales
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext locales-all

      - name: Start the PHP web server
        run: composer start

      - name: Wait for server PID and HTTP readiness
        id: server-check
        run: |
          MAX_WAIT=10   # max seconds to wait
          COUNT=0
          while [ ! -f server.pid ] && [ $COUNT -lt $MAX_WAIT ]; do
            sleep 1
            COUNT=$((COUNT + 1))
          done

          if [ -f server.pid ]; then
            echo "Server is running."
          else
            echo "Server failed to start within $MAX_WAIT seconds."
            exit 1
          fi

          # wait for the server to actually bind
          MAX_TRIES=30
          for i in $(seq 1 $MAX_TRIES); do
            if nc -z localhost 8000; then
              echo "Server is ready."
              exit 0
            fi
            sleep 1
          done

          echo "Server did not respond on localhost:8000 after $MAX_TRIES seconds."
          exit 1

      - name: Run tests
        run: time composer test

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Dumping logs ==="
          if [ -d logs ]; then
            find logs -type f -name "*.log" -print -exec cat {} \;
          else
            echo "No logs directory found"
          fi
