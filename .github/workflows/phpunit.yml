name: PHPUnit

on:
  push:
    branches: [ development ]
    paths: [
      '**/*.php',
      'composer.json',
      'composer.lock',
      'phpunit*.xml*',
      '.env.example',
      'jsondata/**',
      'i18n/**',
      'scripts/init-db.sql',
      '.github/workflows/phpunit.yml'
    ]
  pull_request:
    branches: [ development, stable ]
  workflow_dispatch:

concurrency:
  # The ID of the concurrency group. This must be unique to this workflow.
  group: ${{ github.workflow }}-${{ github.ref }}
  # If true, cancel any previous runs in the same concurrency group.
  cancel-in-progress: true

env:
  PHP_VERSION: '8.4'

jobs:
  phpunit_tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          PGUSER: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Initialize PostgreSQL database
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f scripts/init-db.sql
        env:
          PGPASSWORD: postgres

      - name: Setup PHP with PECL extensions
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2.37.1
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: yaml, intl, zip, calendar, gettext, apcu, opcache, pdo_pgsql, pdo_sqlite
          ini-values: apcu.enable_cli=1, opcache.enable=1, opcache.enable_cli=1
          coverage: pcov

      - name: Cache Composer dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-

      - name: Cache PHPUnit cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .phpunit.cache
          key: phpunit-${{ hashFiles('phpunit.xml.dist') }}
          restore-keys: phpunit-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --classmap-authoritative --no-progress

      - name: Configure environment for testing
        run: |
          cp .env.example .env.local
          # Override APP_ENV to 'test' so the pcov bootstrap hooks in
          # public/index.php + public/LitCalTestServer.php fire — both gate
          # on APP_ENV === 'test'. Without this we silently fall back to
          # PHPUnit's in-process coverage only, since .env.example ships
          # APP_ENV=development.
          echo "APP_ENV=test" >> .env.local
          echo "UNAUTHENTICATED_RATE_LIMIT=999999" >> .env.local
          echo "DB_HOST=localhost" >> .env.local
          echo "DB_PORT=5432" >> .env.local
          echo "DB_NAME=litcal" >> .env.local
          echo "DB_USER=litcal" >> .env.local
          echo "DB_PASSWORD=litcal_secure_password" >> .env.local

      - name: Install gettext + locales
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext locales-all

      - name: Apply Doctrine migrations
        # scripts/init-db.sql is bootstrap-only (roles, databases, pgcrypto,
        # empty doctrine_migration_versions tracking table). Application
        # tables (access_requests, applications, api_keys, audit_log) are
        # created by Doctrine migrations and must be applied before the
        # PHP web server starts — Routes/* and Handlers/Admin/* tests
        # exercise endpoints that query those tables directly.
        run: composer db:migrate

      - name: Start the PHP web server (instrumented with pcov)
        # PCOV_SERVER_COVERAGE_DIR triggers the bootstrap hook in
        # public/index.php that dumps per-request pcov data so HTTP integration
        # tests in phpunit_tests/Routes/* contribute to the merged report
        # (otherwise pcov sees only the PHPUnit process). The hook is also
        # gated on APP_ENV=test, so it stays dormant in production.
        run: composer start
        env:
          PCOV_SERVER_COVERAGE_DIR: ${{ github.workspace }}/coverage/pcov-server

      - name: Wait for server PID and HTTP readiness
        id: server-check
        run: |
          MAX_WAIT=10   # max seconds to wait
          COUNT=0
          while [ ! -f server.pid ] && [ $COUNT -lt $MAX_WAIT ]; do
            sleep 1
            COUNT=$((COUNT + 1))
          done

          if [ -f server.pid ]; then
            echo "Server is running."
          else
            echo "Server failed to start within $MAX_WAIT seconds."
            exit 1
          fi

          # wait for the server to actually bind
          MAX_TRIES=30
          for i in $(seq 1 $MAX_TRIES); do
            if nc -z localhost 8000; then
              echo "Server is ready."
              exit 0
            fi
            sleep 1
          done

          echo "Server did not respond on localhost:8000 after $MAX_TRIES seconds."
          exit 1

      - name: Start the WebSocket test server (instrumented with pcov)
        # The Ratchet-driven WS server (public/LitCalTestServer.php) is the
        # only entry point that reaches src/Test/ (LitTestRunner et al.) and
        # Health.php's onOpen/onMessage/onClose. Same triple-gated hook as the
        # HTTP server; ws-start-server.sh honors PCOV_SERVER_COVERAGE_DIR.
        run: composer ws:start
        env:
          PCOV_SERVER_COVERAGE_DIR: ${{ github.workspace }}/coverage/pcov-server

      - name: Wait for WS server to bind
        run: |
          for i in $(seq 1 30); do
            if nc -z localhost 8082; then
              echo "WS server is ready."
              exit 0
            fi
            sleep 1
          done
          echo "WS server did not respond on localhost:8082; continuing — WebSocket tests will self-skip."

      - name: Run tests with coverage and JUnit output
        run: time composer test:coverage

      - name: Stop the WebSocket test server
        if: ${{ !cancelled() }}
        run: composer ws:stop || true

      - name: Stop the PHP web server
        # Stop before merging so per-request shutdown handlers flush their
        # final dump files (and so a stalled worker doesn't hold the job open).
        if: ${{ !cancelled() }}
        run: composer stop || true

      - name: Merge server pcov dumps into the clover report
        if: ${{ !cancelled() }}
        # Folds the per-request coverage data captured by the dev-server
        # bootstrap hook (public/index.php) into the in-process clover PHPUnit
        # produced. After this step coverage.xml reflects both layers.
        # The merger's stderr is tee'd into $GITHUB_STEP_SUMMARY so the
        # "lifted N lines across M files" headline is visible on the run
        # summary page without digging through job logs.
        run: |
          {
            echo "## pcov server-side dump merge"
            echo ""
            if [ -d coverage/pcov-server ] && [ -n "$(ls -A coverage/pcov-server 2>/dev/null)" ]; then
              echo '```'
              php scripts/merge-pcov-coverage.php coverage.xml coverage/pcov-server coverage.merged.xml 2>&1
              echo '```'
              mv coverage.merged.xml coverage.xml
            else
              echo "> [!WARNING]"
              echo "> **No server-side pcov dumps were produced.** Coverage will reflect PHPUnit's in-process"
              echo "> coverage only — the HTTP- and WS-driven integration tests in phpunit_tests/Routes/"
              echo "> and phpunit_tests/WebSocket/ won't contribute. This usually means the pcov bootstrap"
              echo "> hook in public/index.php / public/LitCalTestServer.php didn't fire. Check that"
              echo "> APP_ENV=test is set in .env.local and that PCOV_SERVER_COVERAGE_DIR is exported"
              echo "> when starting both servers."
            fi
            echo ""
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Coverage summary
        if: ${{ !cancelled() }}
        # Emit a per-layer Markdown table from the merged clover so the
        # project totals + bucket breakdown surface directly on the workflow
        # run page (no Codecov round-trip needed).
        run: |
          if [ -f coverage.xml ]; then
            php scripts/coverage-summary.php coverage.xml >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: Liturgical-Calendar/LiturgicalCalendarAPI
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./junit.xml
          fail_ci_if_error: false

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Dumping logs ==="
          if [ -d logs ]; then
            find logs -type f -name "*.log" -print -exec cat {} \;
          else
            echo "No logs directory found"
          fi
