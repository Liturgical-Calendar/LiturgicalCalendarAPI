name: Linting, static analysis, and POTs update

# Controls when the workflow will run
on:
  push:
    branches: [ development ]
    # This filter is workflow-wide: every job below is skipped when it misses, so it
    # has to list everything ANY of them depends on, not only the sources they lint.
    #
    # jsondata/** and i18n/** are here for the data guards below (jsondata_lint,
    # locale_readiness), which assert facts about committed data rather than about
    # PHP — a data-only push would otherwise skip the very jobs that police it.
    # Mirrors the push filter phpunit.yml already uses for the same reason.
    #
    # composer.json/composer.lock are here because every job installs dependencies and
    # runs tools pinned by them: a lockfile bump that moves phpstan or phpcs changes
    # what static_analysis and codesniffer would say, and must not skip them. main.yml
    # itself is here so a change to this workflow actually exercises it.
    #
    # Note the pull_request trigger below has no paths filter at all, so PRs always run
    # everything; this filter only governs pushes to development, where it is the
    # post-merge safety net rather than the gate.
    paths:
      - '**/*.php'
      - '**/*.md'
      - 'jsondata/**'
      - 'i18n/**'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/main.yml'
  pull_request:
    branches: [ development, stable ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.4'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}

      # Restore vendor folder from cache if available
      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # Share vendor folder with other jobs in this run
      - name: Upload vendor folder
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vendor-folder
          path: vendor
          retention-days: 1

  codesniffer:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}

      - name: Download vendor folder from build job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vendor-folder
          path: vendor

      - name: Fix permissions on vendor binaries
        run: test -d vendor/bin && chmod +x vendor/bin/* || true

      - name: PHP Code Sniffer
        run: composer lint

  jsondata_lint:
    runs-on: ubuntu-latest
    needs: build
    # Least privilege: this job only reads the tree and re-encodes JSON. It needs no
    # write scope, and `actions: read` is deliberately NOT granted — download-artifact
    # resolves same-run artifacts through the runtime token, not GITHUB_TOKEN.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; don't leave the token in .git/config for later steps.
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}

      - name: Download vendor folder from build job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vendor-folder
          path: vendor

      - name: Fix permissions on vendor binaries
        run: test -d vendor/bin && chmod +x vendor/bin/* || true

      - name: JSON source data canonical-encoding check
        run: composer lint:jsondata

  # The missals tree carries two structural invariants that nothing at runtime checks and
  # that both fail silently: the {missal_folder}/{missal_folder}.json naming convention that
  # every path resolver is written against (#940), and the rule that an event_key shared by
  # two sanctorale missals denotes the SAME saint — which a matching month/day is the proxy
  # for. `StIsidore` meant Isidore of Seville in the 1970 editio typica and Isidore the Farmer
  # in US_2011, so the US row silently overwrote Seville's and took his readings with it (#939).
  # Neither defect produced an error anywhere; both produced a wrong calendar.
  #
  # Least privilege, as jsondata_lint above: it only reads the tree.
  missals_lint:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; don't leave the token in .git/config for later steps.
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}

      - name: Download vendor folder from build job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vendor-folder
          path: vendor

      - name: Fix permissions on vendor binaries
        run: test -d vendor/bin && chmod +x vendor/bin/* || true

      - name: Missal naming convention and event_key identity
        run: composer lint:missals

  # The Psalter is numbered two incompatible ways (Hebrew/Masoretic and Greek/Vulgate), and each
  # locale's own liturgical books follow one or the other. A psalm citation in the wrong numbering
  # is not a differently-formatted citation — it names a DIFFERENT PSALM. Nothing else in CI can
  # see this: schema validation only checks that a string is a string, and #969's key-set
  # comparison agrees perfectly across six files holding six different psalms under the same key.
  # `nl.json` held Latin numbers under a Dutch key for years and every existing check passed it.
  #
  # Least privilege, as jsondata_lint above: it only reads the tree.
  lectionary_psalms_lint:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; don't leave the token in .git/config for later steps.
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}

      - name: Download vendor folder from build job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vendor-folder
          path: vendor

      - name: Fix permissions on vendor binaries
        run: test -d vendor/bin && chmod +x vendor/bin/* || true

      - name: Lectionary psalm numbering convention
        run: composer lint:lectionary-psalms

  # Declaring a locale officially supported changes behaviour, not just a label:
  # ReadingsMap serves an official locale STRICTLY and throws on a missing readings
  # entry, while degrading quietly for every other locale (#904). So a commit that
  # deletes a lectionary corpus, or blanks a decreed event's name, converts a silent
  # gap into a production 500 for a calendar the API advertises. That is how the
  # Croatian calendar went down — found by a user, not by CI. This job is the gate.
  #
  # Least privilege, as jsondata_lint above: it only reads the tree.
  locale_readiness:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; don't leave the token in .git/config for later steps.
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}

      - name: Download vendor folder from build job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vendor-folder
          path: vendor

      - name: Fix permissions on vendor binaries
        run: test -d vendor/bin && chmod +x vendor/bin/* || true

      - name: Officially supported locales are complete
        run: composer lint:locales

  static_analysis:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}

      - name: Download vendor folder from build job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vendor-folder
          path: vendor

      - name: Fix permissions on vendor binaries
        run: test -d vendor/bin && chmod +x vendor/bin/* || true

      - name: PHPStan
        run: composer analyse

  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Markdown lint
        run: npx --yes markdownlint-cli2 "**/*.md" "#node_modules" "#vendor" "#.aider*"

  # Advisory, never gating. Redocly reports problems the PHP tooling cannot see —
  # examples that do not validate against their own schema, unreachable $refs,
  # missing operationIds. One of those had already shipped: the GET /validations
  # example omitted a required property (#906), and nothing in CI looked.
  #
  # Deliberately NOT a required check. Redocly's `recommended` ruleset carries
  # opinions we do not all share, and its `oneOf` overlap analysis produces known
  # false positives here (#908). A gating job would invite blanket suppressions,
  # which is the opposite of what this is for. It succeeds regardless and writes
  # its findings to the run summary, so a reviewer sees them without being blocked.
  openapi_lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: OpenAPI description lint (advisory)
        run: |
          set -o pipefail
          # `|| true` on the pipeline, not on the step: a non-zero redocly exit must
          # still let us publish the output rather than aborting the step silently.
          npx --yes @redocly/cli lint 2>&1 | tee redocly.out || true

          {
            echo '## OpenAPI lint (advisory)'
            echo
            if grep -q 'Your API description is valid' redocly.out; then
              echo ':white_check_mark: The description is valid.'
            else
              echo ':x: The description did **not** validate. This does not fail the build, but it should be looked at.'
            fi
            echo

            warnings=$(grep -oE 'You have [0-9]+ warnings' redocly.out | grep -oE '[0-9]+' || echo 0)
            ignored=$(grep -oE '[0-9]+ problems are explicitly ignored' redocly.out | grep -oE '^[0-9]+' || echo 0)

            echo "| | Count |"
            echo "| ----------------------- | ----- |"
            echo "| Warnings                | ${warnings} |"
            echo "| Explicitly ignored      | ${ignored} |"
            echo

            if [ "${warnings}" != "0" ]; then
              echo 'Warnings are at zero on `development`. A non-zero count here means this branch introduced one.'
              echo
              echo '<details><summary>Full output</summary>'
              echo
              echo '```text'
              cat redocly.out
              echo '```'
              echo
              echo '</details>'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

          # Surface it in the PR's annotation list too, where a reviewer will see it
          # without opening the run.
          if [ "$(grep -oE 'You have [0-9]+ warnings' redocly.out | grep -oE '[0-9]+' || echo 0)" != "0" ]; then
            echo "::warning title=OpenAPI lint::redocly reported warnings; development is at zero, so this branch likely introduced them. See the job summary."
          fi

  deploy_payload:
    runs-on: ubuntu-latest
    # Least privilege, as jsondata_lint above: this job only reads the tree and
    # enumerates what rsync would transfer. It writes nothing and calls no API.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; don't leave the token in .git/config for later steps.
          persist-credentials: false

      # The API is served as a folder under the frontend docroot, and the nginx
      # location for it does `try_files $uri ...` — so any file physically present
      # under /api/{dev,vN}/ is served straight off disk, before the front
      # controller sees the request. rsync-exclude.txt is a denylist; this asserts
      # the resulting payload against an allowlist instead, so a new dev-only file
      # fails here rather than becoming publicly fetchable.
      - name: Deploy payload contains only runtime files
        run: ./.github/deploy/check-deploy-payload.sh

  gettext_update:
    runs-on: ubuntu-latest
    needs: [codesniffer, static_analysis]
    if: github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update source file translation strings
        id: update_pot
        run: |
          sudo apt-get update -y && sudo apt-get install -y gettext
          xgettext --from-code=UTF-8 --add-comments='translators:' \
                   --keyword="pgettext:1c,2" \
                   -o i18n/litcal.pot $(git ls-files '*.php')
          echo "POT_LINES_CHANGED=$(git diff -U0 | grep '^[+|-][^+|-]' | grep -Ev '^[+-]"POT-Creation-Date' | wc -l)" >> $GITHUB_OUTPUT

      # Opened with WORKFLOW_AUTOMERGE_PAT rather than the default GITHUB_TOKEN.
      # A PR opened by GITHUB_TOKEN does not trigger further workflows, so the
      # `static_analysis` and `phpunit_tests` contexts that branch protection on
      # development requires would never report on it, and the merge was refused
      # forever with "the base branch policy prohibits the merge" (see #759).
      # Opening it as a real identity makes both required checks run.
      - name: Create Pull Request
        id: cpr
        if: ${{ steps.update_pot.outputs.POT_LINES_CHANGED > 0 }}
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.WORKFLOW_AUTOMERGE_PAT }}
          commit-message: "chore: regenerate i18n/litcal.pot from source files"
          branch: automated/update-pot
          title: "chore: regenerate i18n/litcal.pot from source files"
          body: |
            Automated update of `i18n/litcal.pot` translation template from source PHP files.

            This PR was generated by the `gettext_update` CI job and is
            auto-merged: the .pot is deterministic xgettext output with no
            behavioural code, so there is nothing for CI to validate.
          add-paths: i18n/litcal.pot

      # Hand the merge to GitHub rather than performing it inline. Branch
      # protection on development requires the `static_analysis` and
      # `phpunit_tests` contexts, and phpunit_tests alone runs for ~5 minutes, so
      # the previous approach — `gh pr merge` with six 5-second retries in the
      # same run that opened the PR — could never win that race. It failed every
      # time with "the base branch policy prohibits the merge", leaving the .pot
      # PR stranded and this job red (#759). `--auto` finishes immediately and
      # lets GitHub merge once both contexts are green.
      #
      # The earlier comment here warned that --auto is rejected on an
      # already-clean PR ("Pull request is in clean status"). That is still true,
      # and is exactly what happens if branch protection ever stops requiring
      # checks — so fall back to merging directly in that case, and only in that
      # case, which keeps this working under either policy without swallowing
      # genuine failures.
      #
      # --delete-branch removes the automated/update-pot head branch (explicit,
      # not relying on the repo's delete_branch_on_merge setting). The github.ref
      # guard pins the merge to development, so widening the push filter above can
      # never cause an accidental merge into another branch (e.g. stable).
      - name: Auto-merge the POT update PR
        if: ${{ steps.cpr.outputs.pull-request-number && github.ref == 'refs/heads/development' }}
        run: |
          if gh pr merge "$PR_NUMBER" --auto --merge --delete-branch; then
            echo "Auto-merge enabled; GitHub will merge PR #$PR_NUMBER once the required checks pass."
            exit 0
          fi

          # --auto failing is only benign in one case: the PR needs no checks and
          # is therefore already CLEAN, which GitHub rejects with "Pull request is
          # in clean status". Confirm that before merging directly, so a failure
          # from a missing or under-scoped token, an API error, or auto-merge being
          # disabled on the repo surfaces as itself instead of being masked by a
          # second attempt that fails for an unrelated-looking reason.
          MERGE_STATE=$(gh pr view "$PR_NUMBER" --json mergeStateStatus --jq .mergeStateStatus)
          if [ "$MERGE_STATE" != "CLEAN" ]; then
            echo "::error::Could not enable auto-merge on PR #$PR_NUMBER, and its merge state is ${MERGE_STATE:-unavailable} rather than CLEAN. Not attempting a direct merge; see the gh error above."
            exit 1
          fi

          echo "PR #$PR_NUMBER requires no checks and is already CLEAN; merging directly."
          gh pr merge "$PR_NUMBER" --merge --delete-branch
        env:
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
          GH_TOKEN: ${{ secrets.WORKFLOW_AUTOMERGE_PAT }}
