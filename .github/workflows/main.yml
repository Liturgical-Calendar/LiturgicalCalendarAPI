name: Linting, static analysis, and POTs update

# Controls when the workflow will run
on:
  push:
    branches: [ development ]
    paths: [ '**/*.php', '**/*.md' ]
  pull_request:
    branches: [ development, stable ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.4'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}

      # Restore vendor folder from cache if available
      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # Share vendor folder with other jobs in this run
      - name: Upload vendor folder
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vendor-folder
          path: vendor
          retention-days: 1

  codesniffer:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}

      - name: Download vendor folder from build job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vendor-folder
          path: vendor

      - name: Fix permissions on vendor binaries
        run: test -d vendor/bin && chmod +x vendor/bin/* || true

      - name: PHP Code Sniffer
        run: composer lint

  static_analysis:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}

      - name: Download vendor folder from build job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vendor-folder
          path: vendor

      - name: Fix permissions on vendor binaries
        run: test -d vendor/bin && chmod +x vendor/bin/* || true

      - name: PHPStan
        run: composer analyse

  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Markdown lint
        run: npx --yes markdownlint-cli2 "**/*.md" "#node_modules" "#vendor" "#.aider*"

  gettext_update:
    runs-on: ubuntu-latest
    needs: [codesniffer, static_analysis]
    if: github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Update source file translation strings
        id: update_pot
        run: |
          sudo apt-get update -y && sudo apt-get install -y gettext
          xgettext --from-code=UTF-8 --add-comments='translators:' \
                   --keyword="pgettext:1c,2" \
                   -o i18n/litcal.pot $(git ls-files '*.php')
          echo "POT_LINES_CHANGED=$(git diff -U0 | grep '^[+|-][^+|-]' | grep -Ev '^[+-]"POT-Creation-Date' | wc -l)" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        id: cpr
        if: ${{ steps.update_pot.outputs.POT_LINES_CHANGED > 0 }}
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore: regenerate i18n/litcal.pot from source files"
          branch: automated/update-pot
          title: "chore: regenerate i18n/litcal.pot from source files"
          body: |
            Automated update of `i18n/litcal.pot` translation template from source PHP files.

            This PR was generated by the `gettext_update` CI job and is
            auto-merged: the .pot is deterministic xgettext output with no
            behavioural code, so there is nothing for CI to validate.
          add-paths: i18n/litcal.pot

      # The .pot PR is created with the default GITHUB_TOKEN, which by design
      # does not trigger further workflows — so a separate pull_request-based
      # auto-merge job (like the Dependabot one) would never fire. Instead we
      # merge here, in the same push-triggered run that opened the PR. Branch
      # protection on the base requires neither reviews nor status checks, so
      # GITHUB_TOKEN can merge immediately; --auto is belt-and-suspenders for
      # the brief window after creation, and --delete-branch removes the
      # automated/update-pot head branch (explicit, not relying on the repo's
      # delete_branch_on_merge setting). The github.ref guard pins auto-merge to
      # development, so widening the push filter above can never cause an
      # accidental auto-merge into another branch (e.g. stable).
      - name: Auto-merge the POT update PR
        if: ${{ steps.cpr.outputs.pull-request-number && github.ref == 'refs/heads/development' }}
        run: gh pr merge "$PR_NUMBER" --merge --auto --delete-branch
        env:
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
